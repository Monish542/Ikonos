<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
    <defs>
        <linearGradient id="ikonosFaviconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#06b6d4" />
            <stop offset="50%" stop-color="#8b5cf6" />
            <stop offset="100%" stop-color="#d946ef" />
        </linearGradient>
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="3" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
    </defs>
    <!-- Dark Rounded Backdrop -->
    <rect width="64" height="64" rx="16" fill="#0b0b12" />
    <rect width="62" height="62" x="1" y="1" rx="15" fill="none" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1.5" />
    
    <!-- Stylized Futuristic 'I' Emblem -->
    <path d="M 20 14 H 44 V 20 H 35 V 44 H 44 V 50 H 20 V 44 H 29 V 20 H 20 Z" 
          fill="url(#ikonosFaviconGrad)" 
          filter="url(#glow)" />
</svg>
